<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1557d6">
  <title>BLUEBIRD</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard",
        "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background: #f4f7fb;
      color: #12233f;
    }

    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 38px 22px 34px;
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    .profile {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 24px;
      object-fit: cover;
      display: block;
      box-shadow: 0 10px 26px rgba(21, 87, 214, 0.16);
    }

    .brand {
      margin: 0;
      color: #1557d6;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .slogan {
      margin-top: 7px;
      color: #6680a7;
      font-size: 14px;
      letter-spacing: .5px;
    }

    .intro {
      margin: 0 0 28px;
      text-align: center;
      color: #273b59;
      font-size: 15px;
      line-height: 1.75;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border: 1px solid #dce8fb;
      border-radius: 18px;
      background: #f8fbff;
      color: #14294a;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(24, 70, 125, .05);
      transition: transform .15s ease, background .15s ease;
    }

    .link:hover {
      transform: translateY(-1px);
      background: #f0f6ff;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 19px;
      background: #e8f0ff;
    }


    /* Brand icons */
    .brand-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #e8f0ff;
    }

    .brand-icon img {
      display: block;
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .instagram-icon img {
      width: 33px;
      height: 33px;
    }

    .naver-cafe-icon img {
      width: 35px;
      height: 35px;
    }

    .title {
      font-size: 15px;
      font-weight: 750;
    }

    .sub {
      margin-top: 3px;
      color: #7186a5;
      font-size: 12px;
    }

    .arrow {
      color: #7590b5;
      font-size: 25px;
      line-height: 1;
      margin-left: 12px;
    }

    footer {
      position: relative;
      z-index: 2;
      margin-top: 42px;
      text-align: center;
      color: #8297b5;
      font-size: 12px;
      line-height: 1.7;
    }

    .footer-brand {
      margin-bottom: 4px;
      color: #1557d6;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .waves {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -36px;
      height: 115px;
      background:
        radial-gradient(90% 80px at 20% 100%, #dceaff 0 58%, transparent 59%),
        radial-gradient(95% 78px at 78% 100%, #cbdfff 0 58%, transparent 59%);
      opacity: .9;
      pointer-events: none;
    }
  </style>
</head>
